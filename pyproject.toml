[project]
name = "weather-app"
version = "1.0.0"
description = "Streamlit weather forecast app powered by the OpenWeatherMap API."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Rafaela Uto" }]
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
